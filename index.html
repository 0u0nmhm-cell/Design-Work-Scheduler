<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宅設計 スケジュール管理</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1f2e;
  --ink2: #2c3047;
  --line: #dde1ef;
  --line2: #eef0f8;
  --paper: #f7f8fc;
  --white: #ffffff;
  --blue: #2563eb;
  --blue-light: #eff4ff;
  --blue-mid: #bfcffd;
  --teal: #0d9488;
  --teal-light: #f0fdfa;
  --amber: #d97706;
  --amber-light: #fffbeb;
  --red: #dc2626;
  --red-light: #fef2f2;
  --green: #16a34a;
  --green-light: #f0fdf4;
  --muted: #6b7280;
  --muted2: #9ca3af;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  min-height: 100vh;
}

/* ─────── HEADER ─────── */
.header {
  background: var(--ink);
  padding: 18px 20px 16px;
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
}
.header-left { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 32px; height: 32px; background: var(--blue);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 1rem;
}
.header h1 {
  font-size: 0.92rem; font-weight: 700; color: #fff;
  letter-spacing: 0.06em;
}
.header-date {
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem; color: #9ca3af; letter-spacing: 0.04em;
}

/* ─────── NAV ─────── */
.nav {
  background: var(--white);
  border-bottom: 1px solid var(--line);
  display: flex; overflow-x: auto;
  padding: 0 12px;
}
.nav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex-shrink: 0; padding: 12px 16px; border: none; background: none;
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.8rem;
  color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.18s; white-space: nowrap; letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 5px;
}
.nav-btn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 700; }
.nav-btn:hover:not(.active) { color: var(--ink); }

/* ─────── CONTENT ─────── */
.content { padding: 16px; max-width: 640px; margin: 0 auto; }

/* ─────── TODAY SUMMARY ─────── */
.summary-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-bottom: 18px;
}
.summary-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px 10px; text-align: center;
}
.summary-card .s-num {
  font-family: 'DM Mono', monospace;
  font-size: 1.6rem; font-weight: 500; line-height: 1;
  margin-bottom: 4px;
}
.summary-card .s-label { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.04em; }
.s-red .s-num { color: var(--red); }
.s-amber .s-num { color: var(--amber); }
.s-green .s-num { color: var(--green); }

/* ─────── SECTION HEADER ─────── */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.sec-title {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
  color: var(--muted); text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.sec-title::before {
  content: ''; display: block; width: 3px; height: 12px;
  background: var(--blue); border-radius: 2px;
}

/* ─────── TASK CARD ─────── */
.task-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: 10px; padding: 13px 14px; margin-bottom: 8px;
  display: flex; gap: 12px; align-items: flex-start;
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.task-card.t-red { border-left: 3px solid var(--red); background: var(--red-light); }
.task-card.t-amber { border-left: 3px solid var(--amber); background: var(--amber-light); }
.task-card.t-blue { border-left: 3px solid var(--blue); }
.task-card.t-green { border-left: 3px solid var(--green); }

/* サブタスク */
.task-card.sub { border-left: 3px solid var(--muted2); border-style: dashed; opacity: 0.88; }
.task-card.sub.t-red { background: #fff5f5; border-left-color: var(--red); }
.task-card.sub.t-amber { background: #fffcf0; border-left-color: var(--amber); }
.task-card.sub.t-blue { background: var(--white); border-left-color: var(--muted2); }
.sub-badge { font-size: 0.62rem; padding: 1px 6px; border-radius: 20px; background: var(--line2); color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }

.task-icon-wrap {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; flex-shrink: 0;
}
.t-red .task-icon-wrap { background: rgba(220,38,38,0.1); }
.t-amber .task-icon-wrap { background: rgba(217,119,6,0.1); }
.t-blue .task-icon-wrap { background: var(--blue-light); }
.t-green .task-icon-wrap { background: var(--green-light); }

.task-body { flex: 1; min-width: 0; }
.task-proj { font-size: 0.68rem; color: var(--muted); margin-bottom: 2px; }
.task-name { font-size: 0.86rem; font-weight: 500; margin-bottom: 4px; }
.task-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.task-date { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); }
.badge {
  font-size: 0.65rem; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; letter-spacing: 0.03em;
}
.badge-red { background: rgba(220,38,38,0.12); color: var(--red); }
.badge-amber { background: rgba(217,119,6,0.12); color: var(--amber); }
.badge-blue { background: var(--blue-light); color: var(--blue); }
.badge-green { background: var(--green-light); color: var(--green); }
.badge-gray { background: var(--line2); color: var(--muted); }

/* ─────── PROJECT CARD ─────── */
.proj-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  animation: fadeUp 0.3s ease both;
}
.proj-head {
  padding: 14px 16px 10px;
  display: flex; justify-content: space-between; align-items: flex-start;
}
.proj-name { font-size: 0.92rem; font-weight: 700; margin-bottom: 3px; }
.proj-sub { font-size: 0.72rem; color: var(--muted); }
.proj-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tag {
  font-size: 0.65rem; padding: 2px 8px; border-radius: 20px;
  background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-mid);
}
.proj-actions { display: flex; gap: 5px; flex-shrink: 0; }
.btn-xs {
  padding: 5px 10px; border-radius: 6px; font-size: 0.72rem;
  font-family: 'Zen Kaku Gothic New', sans-serif; cursor: pointer;
  transition: all 0.15s; border: 1px solid var(--line); background: var(--paper);
  color: var(--ink);
}
.btn-xs:hover { background: var(--line2); }
.btn-xs.danger:hover { background: var(--red-light); border-color: var(--red); color: var(--red); }

.proj-progress { padding: 0 16px 4px; }
.prog-bar { height: 5px; background: var(--line2); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--blue), #60a5fa); border-radius: 3px; transition: width 0.6s; }
.prog-text { font-size: 0.68rem; color: var(--muted); margin-top: 4px; text-align: right; font-family: 'DM Mono', monospace; }

.proj-next {
  margin: 8px 16px 0;
  background: var(--line2); border-radius: 8px;
  padding: 8px 10px; font-size: 0.76rem; display: flex; align-items: center; gap: 6px;
}
.proj-next .pn-label { color: var(--muted); flex-shrink: 0; }
.proj-next .pn-val { font-weight: 500; }

.proj-foot {
  padding: 8px 16px 14px;
  display: flex; gap: 6px;
}

/* ─────── FORM ─────── */
.form-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: 12px; padding: 20px;
}
.form-section { margin-bottom: 20px; }
.form-section-title {
  font-size: 0.72rem; font-weight: 700; color: var(--muted);
  letter-spacing: 0.08em; margin-bottom: 10px; text-transform: uppercase;
}
.field { margin-bottom: 12px; }
.field label {
  display: block; font-size: 0.76rem; color: var(--ink2);
  font-weight: 500; margin-bottom: 5px;
}
.field input, .field select {
  width: 100%; background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; color: var(--ink);
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.84rem;
  outline: none; transition: border 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--blue); background: var(--white); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.checkbox-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.check-item {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; cursor: pointer; transition: all 0.15s;
  background: var(--paper);
}
.check-item:hover { border-color: var(--blue); background: var(--blue-light); }
.check-item input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; }
.check-item span { font-size: 0.76rem; }

.btn-primary {
  width: 100%; padding: 13px; border-radius: 10px; border: none;
  background: var(--blue); color: #fff;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  transition: background 0.18s; letter-spacing: 0.06em;
}
.btn-primary:hover { background: #1d4ed8; }

/* ─────── TIMELINE MODAL ─────── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(15,17,28,0.6); z-index: 200;
  padding: 20px; align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.drawer {
  background: var(--white); border-radius: 16px 16px 0 0;
  width: 100%; max-width: 600px; max-height: 88vh;
  overflow-y: auto; padding: 20px;
  animation: slideUp 0.28s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.drawer-handle {
  width: 40px; height: 4px; background: var(--line);
  border-radius: 2px; margin: 0 auto 16px;
}
.drawer h3 {
  font-size: 1rem; font-weight: 700; margin-bottom: 4px;
}
.drawer-sub { font-size: 0.76rem; color: var(--muted); margin-bottom: 18px; }

/* ─────── MILESTONE TIMELINE ─────── */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
  width: 2px; background: var(--line);
}
.tl-item {
  position: relative; margin-bottom: 14px;
}
.tl-dot {
  position: absolute; left: -20px; top: 3px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--white);
  box-shadow: 0 0 0 2px var(--line);
}
.tl-item.tl-past .tl-dot { background: var(--muted2); box-shadow: 0 0 0 2px var(--muted2); }
.tl-item.tl-today .tl-dot { background: var(--blue); box-shadow: 0 0 0 2px var(--blue); width: 12px; height: 12px; left: -21px; top: 2px; }
.tl-item.tl-urgent .tl-dot { background: var(--red); box-shadow: 0 0 0 2px var(--red); }
.tl-item.tl-soon .tl-dot { background: var(--amber); box-shadow: 0 0 0 2px var(--amber); }
.tl-item.tl-future .tl-dot { background: var(--green); box-shadow: 0 0 0 2px var(--green); }

.tl-content {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 12px;
  display: flex; align-items: center; gap: 8px;
}
.tl-item.tl-today .tl-content { background: var(--blue-light); border-color: var(--blue-mid); }
.tl-item.tl-urgent .tl-content { background: var(--red-light); border-color: #fca5a5; }
.tl-item.tl-past .tl-content { opacity: 0.5; }

.tl-icon { font-size: 0.9rem; }
.tl-main { flex: 1; }
.tl-name { font-size: 0.8rem; font-weight: 500; }
.tl-date { font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--muted); }
.tl-badge { flex-shrink: 0; }

/* ─────── EMPTY ─────── */
.empty {
  text-align: center; padding: 40px 20px;
  color: var(--muted); font-size: 0.82rem;
  border: 1px dashed var(--line); border-radius: 12px;
  background: var(--white);
}
.empty .e-icon { font-size: 2rem; margin-bottom: 8px; }

/* ─────── TASK COMPLETE CHECK ─────── */
.task-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--white);
  cursor: pointer; flex-shrink: 0; margin-top: 7px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
}
.task-check:hover { border-color: var(--green); background: var(--green-light); }
.task-check.checked { border-color: var(--green); background: var(--green); }
.task-check.checked::after { content: '✓'; color: #fff; font-size: 0.7rem; font-weight: 700; }
.task-card.done { opacity: 0.45; }
.task-card.done .task-name { text-decoration: line-through; color: var(--muted); }

/* ─────── MEMO ─────── */
.memo-area {
  margin: 0 16px 12px; 
}
.memo-input {
  width: 100%; background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 12px; color: var(--ink);
  font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 0.78rem;
  outline: none; resize: none; transition: border 0.15s;
  min-height: 52px;
}
.memo-input:focus { border-color: var(--blue); background: var(--white); }
.memo-input::placeholder { color: var(--muted2); }
.memo-label {
  font-size: 0.68rem; color: var(--muted); margin-bottom: 4px;
  letter-spacing: 0.05em;
}

/* ─────── TIMELINE CHECK ─────── */
.tl-check {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--line); background: var(--white);
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
}
.tl-check:hover { border-color: var(--green); }
.tl-check.checked { border-color: var(--green); background: var(--green); }
.tl-check.checked::after { content: '✓'; color: #fff; font-size: 0.72rem; font-weight: 700; }
.tl-item.tl-done .tl-content { opacity: 0.4; }
.tl-item.tl-done .tl-name { text-decoration: line-through; }

.hidden { display: none !important; }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="logo">🏠</div>
    <h1>住宅設計 スケジュール管理</h1>
  </div>
  <div class="header-date" id="headerDate"></div>
</header>

<nav class="nav">
  <button class="nav-btn active" onclick="showTab('today')" id="nav-today">📋 今日のタスク</button>
  <button class="nav-btn" onclick="showTab('projects')" id="nav-projects">🗂 案件一覧</button>
  <button class="nav-btn" onclick="showTab('add')" id="nav-add">＋ 新規案件</button>
</nav>

<!-- ═══ TODAY ═══ -->
<div id="tab-today" class="content">
  <div class="summary-grid">
    <div class="summary-card s-red">
      <div class="s-num" id="cnt-urgent">0</div>
      <div class="s-label">要対応</div>
    </div>
    <div class="summary-card s-amber">
      <div class="s-num" id="cnt-soon">0</div>
      <div class="s-label">今週締切</div>
    </div>
    <div class="summary-card s-green">
      <div class="s-num" id="cnt-proj">0</div>
      <div class="s-label">進行案件</div>
    </div>
  </div>

  <div class="sec-head">
    <div class="sec-title">本日〜2週間のタスク</div>
  </div>
  <div id="todayTasks"></div>
</div>

<!-- ═══ PROJECTS ═══ -->
<div id="tab-projects" class="content hidden">
  <div class="sec-head">
    <div class="sec-title">進行中の案件</div>
  </div>
  <div id="projectList"></div>
</div>

<!-- ═══ ADD ═══ -->
<div id="tab-add" class="content hidden">
  <div class="form-card">
    <div class="form-section">
      <div class="form-section-title">基本情報</div>
      <div class="field">
        <label>案件名</label>
        <input type="text" id="f-name" placeholder="例：田中邸新築工事、○○マンション計画">
      </div>
      <div class="field-row">
        <div class="field">
          <label>建物種別</label>
          <select id="f-btype">
            <option value="戸建住宅（木造）">戸建住宅（木造）</option>
            <option value="戸建住宅（RC・S造）">戸建住宅（RC・S造）</option>
            <option value="共同住宅（木造）">共同住宅（木造）</option>
            <option value="共同住宅（RC・S造）">共同住宅（RC・S造）</option>
          </select>
        </div>
        <div class="field">
          <label>規模</label>
          <select id="f-scale">
            <option value="small">〜100㎡</option>
            <option value="mid" selected>100〜300㎡</option>
            <option value="large">300㎡〜</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">基準日設定（わかっている日付を入力）</div>
      <div class="field">
        <label>①契約日</label>
        <input type="date" id="f-keiyaku">
      </div>
      <div class="field">
        <label>②社内打ち合わせ日</label>
        <input type="date" id="f-uchiawase">
      </div>
      <div class="field">
        <label>③色決め日</label>
        <input type="date" id="f-irokime">
      </div>
      <div class="field">
        <label>④着工予定日</label>
        <input type="date" id="f-kouji">
      </div>
    </div>

    <div class="form-section">
      <div class="form-section-title">申請・評価の種別（該当するものを選択）</div>
      <div class="checkbox-grid">
        <label class="check-item">
          <input type="checkbox" value="kakunin" checked> <span>✅ 確認申請</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="shoenkan"> <span>📐 省エネ適判</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="chokkanpo"> <span>🔥 消防同意</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="chokusho"> <span>📋 長期優良住宅</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="seinou"> <span>🏅 設計性能評価</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="bels"> <span>⚡ BELS</span>
        </label>
        <label class="check-item">
          <input type="checkbox" value="chikku"> <span>🗺 景観・地区計画届</span>
        </label>
      </div>
    </div>

    <button class="btn-primary" onclick="addProject()">スケジュールを自動生成して登録</button>
  </div>
</div>

<!-- ローディングバー -->
<div id="loadingBar" style="display:none;position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--green));z-index:9999;animation:loading 1.2s ease-in-out infinite;">
</div>

<!-- ═══ DRAWER ═══ -->
<div class="overlay" id="drawer">
  <div class="drawer">
    <div class="drawer-handle"></div>
    <h3 id="drawerTitle">案件タイムライン</h3>
    <div class="drawer-sub" id="drawerSub"></div>
    <div class="memo-area" style="margin:0 0 14px;">
      <div class="memo-label">📝 メモ</div>
      <textarea class="memo-input" id="drawerMemo" placeholder="メモを入力..." rows="2" oninput="saveMemo()"></textarea>
    </div>
    <div class="timeline" id="drawerTimeline"></div>
    <button class="btn-primary" style="margin-top:18px;" onclick="closeDrawer()">閉じる</button>
  </div>
</div>

<script>
// ────────────────────────────────────────────
// DATE HELPERS
// ────────────────────────────────────────────
const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const WD = ['日','月','火','水','木','金','土'];

function fmt(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
}
function fmtJP(d) {
  const dt = new Date(d);
  return `${dt.getMonth()+1}月${dt.getDate()}日（${WD[dt.getDay()]}）`;
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function diff(d) { const dt = new Date(d); dt.setHours(0,0,0,0); return Math.round((dt-TODAY)/86400000); }

// ────────────────────────────────────────────
// SCHEDULE BUILDER
// ────────────────────────────────────────────
// dates: { keiyaku, uchiawase, irokime, kouji } — それぞれ Date or null
function buildSchedule(dates, apps) {
  const Y = dates.keiyaku   ? new Date(dates.keiyaku)   : null;
  const U = dates.uchiawase ? new Date(dates.uchiawase) : null;
  const I = dates.irokime   ? new Date(dates.irokime)   : null;
  const K = dates.kouji     ? new Date(dates.kouji)     : null;

  function d(base, offset) {
    if (!base) return null;
    const r = new Date(base); r.setDate(r.getDate() + offset); return r;
  }

  let ms = [];
  const push = (key, name, date, icon, cat, isBase=false, isSub=false) => {
    if (date) ms.push({ key, name, date, icon, cat, isBase, isSub });
  };

  // ── 契約基準タスク ──
  push('keiyaku',  '契約',                  d(Y,   0), '📝', '契約', true);
  push('kouzou',   '構造計算・構造図 完成', d(Y, +24), '🏗', 'CAD',  false, true);

  // ── 社内打ち合わせ基準タスク ──
  push('u_cad',     '①社内打ち合わせ図面 完成（配置・平面・立面）', d(U, -1),  '📋', 'CAD');
  push('uchiawase', '社内打ち合わせ',                               d(U,  0),  '🏢', '社内', true);

  // ── 色決め基準タスク ──
  push('iro_cad',   '②色決め図面 完成（配置・平面・立面）',         d(I, -11), '🖊',  'CAD');
  push('iro_check', '③色決め図面 チェック完了',                     d(I,  -8), '🔍', '確認');
  push('iro_tate',  '④色塗り用立面 完成',                           d(I,  -7), '🎨', 'CAD');
  push('yane',      '⑤屋根・基礎・電気 完成',                       d(I,   0), '🏠', 'CAD');
  push('irokime',   '🎨 色決め',                                    d(I,   0), '🎨', '設計', true);
  push('mitsucad',  '⑥見積図面 完成',                               d(I,  +4), '💴', 'CAD');
  push('kanki',     '換気見積依頼',      d(I,  +7), '💨', '依頼', false, true);
  push('kouzou_sc', '構造計算日程確保',  d(I,  +7), '📅', '手配', false, true);
  push('jiban',     '地盤調査申込',  d(I,  +5), '🔩', '申請', false, true);
  push('kyuhaisu',  '給排水依頼',    d(K, -61), '🚿', '依頼', false, true);

  // ── 着工基準タスク（全案件共通） ──
  push('bels_sub',    '長期・BELS 提出',   d(K, -45), '⚡', '申請');
  push('kakunin_sub', '確認申請 提出',     d(K, -40), '📮', '申請');
  push('kakunin_ok',  '確認済証 取得予定', d(K, -20), '✅', '申請');
  push('kasitan',     '瑕疵担保申し込み',  d(K,  -5), '🛡', '申請', false, true);
  push('kouji',       '着工',             d(K,   0), '🏗', '工事', true);
  push('jiku',        '上棟予定',         d(K, +45), '⛏', '工事');
  push('finish',      '竣工・引渡し',     d(K,+180), '🎉', '完了');

  // ── 申請オプション（着工基準） ──
  if (K) {
    if (apps.includes('chokkanpo')) {
      push('sh_sub','消防同意 申請',              d(K, -55), '🔥', '申請');
      push('sh_ok', '消防同意 取得予定',          d(K, -38), '✅', '申請');
    }
    if (apps.includes('chokusho')) {
      push('ch_city','市役所 認定申請',           d(K, -21), '🏛', '申請');
      push('ch_ok',  '長期 認定通知書 取得予定',  d(K, -14), '✅', '申請');
    }
    if (apps.includes('seinou')) {
      push('se_ok', '設計性能評価書 取得予定',    d(K, -30), '✅', '申請');
    }
    if (apps.includes('chikku')) {
      push('ck_sub','景観・地区計画届 提出',       d(K, -50), '🗺', '申請');
    }
  }

  return ms.sort((a, b) => new Date(a.date) - new Date(b.date));
}

// ────────────────────────────────────────────
// STATE
// ────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycby1EtkrBr2GQaKmU1dV71Mp_mySE0tqf9Cy-i7mkdxrrZG23WHlOYcmLNaORILpRyJf/exec';

let projects = [];
let doneMap  = JSON.parse(localStorage.getItem('juutaku_done') || '{}');
let memoMap  = JSON.parse(localStorage.getItem('juutaku_memo') || '{}');
let currentDrawerProjectId = null;
let isSaving = false;

// 完了・メモはlocalStorageのまま（軽量データ）
function saveDone()  { localStorage.setItem('juutaku_done', JSON.stringify(doneMap)); }
function saveMemos() { localStorage.setItem('juutaku_memo', JSON.stringify(memoMap)); }

// 案件データはGoogle Sheetsへ
async function save(project) {
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'save', data: project }),
    });
  } catch(e) { console.error('save error', e); }
}

async function loadProjects() {
  showLoading(true);
  try {
    const res = await fetch(`${GAS_URL}?action=load`);
    const json = await res.json();
    if (json.ok) {
      projects = json.projects || [];
      renderAll();
    }
  } catch(e) {
    console.error('load error', e);
    document.getElementById('todayTasks').innerHTML = `<div class="empty"><div class="e-icon">⚠️</div>データの読み込みに失敗しました<br><small>ネットワーク接続を確認してください</small></div>`;
  }
  showLoading(false);
}

async function deleteProjectRemote(id) {
  try {
    await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'delete', id }),
    });
  } catch(e) { console.error('delete error', e); }
}

function showLoading(on) {
  document.getElementById('loadingBar').style.display = on ? 'block' : 'none';
}

function doneKey(pid, key) { return `${pid}:${key}`; }
function isDone(pid, key)   { return !!doneMap[doneKey(pid, key)]; }

function toggleDone(pid, key) {
  const k = doneKey(pid, key);
  doneMap[k] = !doneMap[k];
  saveDone();
  renderAll();
  if (currentDrawerProjectId) showDrawer(currentDrawerProjectId);
}

function saveMemo() {
  if (!currentDrawerProjectId) return;
  memoMap[currentDrawerProjectId] = document.getElementById('drawerMemo').value;
  saveMemos();
  renderProjects();
}

// ────────────────────────────────────────────
// ADD PROJECT
// ────────────────────────────────────────────
async function addProject() {
  const name = document.getElementById('f-name').value.trim();
  const btype = document.getElementById('f-btype').value;
  const scale = document.getElementById('f-scale').value;
  const keiyaku   = document.getElementById('f-keiyaku').value;
  const uchiawase = document.getElementById('f-uchiawase').value;
  const irokime   = document.getElementById('f-irokime').value;
  const kouji     = document.getElementById('f-kouji').value;
  const apps = Array.from(document.querySelectorAll('.checkbox-grid input:checked')).map(el => el.value);

  if (!name) { alert('案件名を入力してください'); return; }
  if (!keiyaku && !uchiawase && !irokime && !kouji) { alert('基準日をひとつ以上入力してください'); return; }

  const id = Date.now().toString();
  const dates = { keiyaku: keiyaku||null, uchiawase: uchiawase||null, irokime: irokime||null, kouji: kouji||null };
  const schedule = buildSchedule(dates, apps);
  const project = { id, name, btype, scale, dates, apps, schedule };
  projects.unshift(project);
  renderAll();
  showTab('projects');
  document.getElementById('f-name').value = '';
  document.getElementById('f-keiyaku').value = '';
  document.getElementById('f-uchiawase').value = '';
  document.getElementById('f-irokime').value = '';
  document.getElementById('f-kouji').value = '';
  await save(project);
  await loadProjects();
}

async function deleteProject(id) {
  projects = projects.filter(p => p.id !== id);
  Object.keys(doneMap).forEach(k => { if (k.startsWith(id+':')) delete doneMap[k]; });
  delete memoMap[id];
  saveDone(); saveMemos();
  renderAll();
  await deleteProjectRemote(id);
  await loadProjects();
}

function confirmDelete(id) {
  const cards = document.querySelectorAll('.proj-card');
  let card = null;
  cards.forEach(c => { if (c.dataset.pid === id) card = c; });
  if (!card) return;
  const existing = card.querySelector('.delete-confirm');
  if (existing) { existing.remove(); return; }
  const bar = document.createElement('div');
  bar.className = 'delete-confirm';
  bar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 16px;background:#fef2f2;border-top:1px solid #fca5a5;font-size:0.78rem;color:#dc2626;';
  bar.innerHTML = `<span style="flex:1">本当に削除しますか？</span>
    <button class="btn-xs danger" style="border-color:#dc2626;color:#dc2626;" onclick="deleteProject('${id}')">削除する</button>
    <button class="btn-xs" onclick="this.closest('.delete-confirm').remove()">キャンセル</button>`;
  card.appendChild(bar);
}

async function recalcProject(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  p.schedule = buildSchedule(p.dates || {}, p.apps || []);
  renderAll();
  if (currentDrawerProjectId === id) showDrawer(id);
  await save(p);
}

function toggleEditDates(id) {
  const el = document.getElementById('edit-'+id);
  if (el) el.classList.toggle('hidden');
}

async function saveDates(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  p.dates = {
    keiyaku:   document.getElementById('ed-y-'+id).value || null,
    uchiawase: document.getElementById('ed-u-'+id).value || null,
    irokime:   document.getElementById('ed-i-'+id).value || null,
    kouji:     document.getElementById('ed-k-'+id).value || null,
  };
  p.apps = ['kakunin','shoenkan','chokkanpo','chokusho','seinou','bels','chikku']
    .filter(v => document.getElementById(`ed-app-${v}-${id}`)?.checked);
  p.schedule = buildSchedule(p.dates, p.apps);
  renderAll();
  if (currentDrawerProjectId === id) showDrawer(id);
  await save(p);
}

// ────────────────────────────────────────────
// RENDER TODAY
// ────────────────────────────────────────────
function renderToday() {
  const tasks = [];
  projects.forEach(p => {
    p.schedule.forEach(m => {
      if (isDone(p.id, m.key)) return;
      if (m.isBase || ['uchiawase','irokime','kouji','jiku','finish'].includes(m.key)) return;
      const d = diff(m.date);
      if (d >= -3 && d <= 14) tasks.push({ ...m, projectId: p.id, projectName: p.name, d });
    });
  });
  tasks.sort((a,b) => a.d - b.d);

  let urgent = 0, soon = 0;
  document.getElementById('cnt-proj').textContent = projects.length;

  const el = document.getElementById('todayTasks');
  if (tasks.length === 0) {
    el.innerHTML = `<div class="empty"><div class="e-icon">🎯</div>今後2週間に期限のタスクはありません<br><small style="display:block;margin-top:6px;">案件を追加するとここに表示されます</small></div>`;
    document.getElementById('cnt-urgent').textContent = 0;
    document.getElementById('cnt-soon').textContent = 0;
    return;
  }

  el.innerHTML = tasks.map((t,i) => {
    const cls = t.d < 0 ? 't-red' : t.d <= 2 ? 't-red' : t.d <= 7 ? 't-amber' : 't-blue';
    if (!t.isSub && t.d <= 2) urgent++;
    if (!t.isSub && t.d >= 3 && t.d <= 7) soon++;
    const label = t.d < 0 ? `${Math.abs(t.d)}日超過` : t.d === 0 ? '本日' : `あと${t.d}日`;
    const badgeCls = t.d < 0 ? 'badge-red' : t.d <= 2 ? 'badge-red' : t.d <= 7 ? 'badge-amber' : 'badge-blue';
    const subCls = t.isSub ? ' sub' : '';
    const subBadge = t.isSub ? `<span class="sub-badge">サブ</span>` : '';
    return `<div class="task-card ${cls}${subCls}" style="animation-delay:${i*0.04}s">
      <div class="task-check" onclick="toggleDone('${t.projectId}','${t.key}'); event.stopPropagation()"></div>
      <div class="task-icon-wrap">${t.icon}</div>
      <div class="task-body">
        <div class="task-proj">${t.projectName} ／ ${t.cat} ${subBadge}</div>
        <div class="task-name">${t.name}</div>
        <div class="task-meta">
          <span class="task-date">${fmtJP(t.date)}</span>
          <span class="badge ${badgeCls}">${label}</span>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('cnt-urgent').textContent = urgent;
  document.getElementById('cnt-soon').textContent = soon;
}

// DRAWER
// ────────────────────────────────────────────
function showDrawer(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  currentDrawerProjectId = id;
  document.getElementById('drawerTitle').textContent = p.name;
  const dates2 = p.dates || {};
  const dp2 = [
    dates2.keiyaku   ? `①契約 ${fmt(dates2.keiyaku)}`   : null,
    dates2.uchiawase ? `②打合 ${fmt(dates2.uchiawase)}` : null,
    dates2.irokime   ? `③色決 ${fmt(dates2.irokime)}`   : null,
    dates2.kouji     ? `④着工 ${fmt(dates2.kouji)}`     : null,
  ].filter(Boolean).join('　');
  document.getElementById('drawerSub').textContent = `${p.btype}　${dp2}`;
  document.getElementById('drawerMemo').value = memoMap[id] || '';
  document.getElementById('drawerTimeline').innerHTML = p.schedule.map(m => {
    const done = isDone(p.id, m.key);
    const d = diff(m.date);
    const cls = done ? 'tl-done' : d < 0 ? 'tl-past' : d === 0 ? 'tl-today' : d <= 5 ? 'tl-urgent' : d <= 14 ? 'tl-soon' : 'tl-future';
    const label = done ? '完了✓' : d < 0 ? '期限超過' : d === 0 ? '本日' : `あと${d}日`;
    const bc = done ? 'badge-green' : d < 0 ? 'badge-gray' : d === 0 ? 'badge-blue' : d <= 5 ? 'badge-red' : d <= 14 ? 'badge-amber' : 'badge-green';
    const subMark = m.isSub ? ' <span class="sub-badge">サブ</span>' : '';
    return `<div class="tl-item ${cls}">
      <div class="tl-dot"></div>
      <div class="tl-content">
        <div class="tl-check ${done?'checked':''}" onclick="toggleDone('${p.id}','${m.key}')"></div>
        <div class="tl-icon">${m.icon}</div>
        <div class="tl-main">
          <div class="tl-name">${m.name}${subMark}</div>
          <div class="tl-date">${fmtJP(m.date)}</div>
        </div>
        <div class="tl-badge"><span class="badge ${bc}">${label}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  currentDrawerProjectId = null;
}
document.getElementById('drawer').addEventListener('click', e => { if (e.target === document.getElementById('drawer')) closeDrawer(); });

// ────────────────────────────────────────────
// TABS
// ────────────────────────────────────────────
function showTab(name) {
  ['today','projects','add'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('hidden', t!==name);
    document.getElementById('nav-'+t).classList.toggle('active', t===name);
  });
}

function renderAll() { renderToday(); renderProjects(); }

// ────────────────────────────────────────────
// INIT
// ────────────────────────────────────────────
document.getElementById('headerDate').textContent = `${TODAY.getFullYear()}/${TODAY.getMonth()+1}/${TODAY.getDate()}（${WD[TODAY.getDay()]}）`;
loadProjects();
</script>
